    <main id="main" class="osu-page osu-page--generic-compact page-content">

<div class="page-main">
<p id="editor-message" class="notice" role="status" aria-live="polite" hidden>
</p>
<div id="editor-login" class="notice" hidden>登录后就可以发帖。<a id="editor-login-link" class="text-link" href="/account/?next=/community/new/">登录 / 注册 →</a>
</div>
<form id="post-form" class="panel form-panel">
<div class="field">
<label for="post-category">分类</label>
<select id="post-category" name="category" required>
<option value="discussion">讨论</option>
<option value="help">求助</option>
<option value="showcase">分享</option>
<option value="development">开发记录</option>
</select>
</div>
<div class="field">
<label for="post-title">标题</label>
<input id="post-title" name="title" maxlength="100" placeholder="帖子标题" required>
</div>
<div class="field">
<label for="post-body">正文</label>
<textarea id="post-body" name="body" rows="13" maxlength="12000" placeholder="求助时请附上版本、操作步骤和遇到的问题。" required>
</textarea>
<small>纯文本 · 可以粘贴网页链接 · 最多 12000 字符</small>
</div>
<p class="draft-note">发帖内容公开。请不要贴密码、令牌或私密日志。失败时本页会保留文字供重试；离开本页会丢失未发布内容。</p>
<div class="form-actions">
<button id="post-submit" class="button button-primary" type="submit" disabled>发布帖子</button>
<a class="text-link" href="/community/">返回社区</a>
</div>
</form>
